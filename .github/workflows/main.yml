name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Chạy khi có code mới đẩy lên nhánh main hoặc master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # Cập nhật phiên bản bản vá mới nhất sử dụng Node 24

      - name: Setup Node
        uses: actions/setup-node@v4.2.0 # Cập nhật phiên bản bản vá mới nhất sử dụng Node 24
        with:
          node-version: "24"
          cache: "npm" # Tự động cache node_modules giúp build nhanh hơn
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        env:
          # Dòng này sẽ lấy API Key từ Bước 1 bạn đã cài để đưa vào web
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.1.1 # Cập nhật bản vá hỗ trợ Node 24 thay vì v3 mặc định

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5 # Cập nhật bản vá hỗ trợ Node 24 để đồng bộ đồng loạt
