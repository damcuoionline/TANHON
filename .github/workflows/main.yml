name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Chạy khi có code mới đẩy lên nhánh main hoặc master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Giữ @v4, GitHub tự động trỏ về bản patch mới nhất hỗ trợ Node 24

      - name: Setup Node
        uses: actions/setup-node@v4 # Giữ @v4, tự động chạy Node 24 ngầm định
        with:
          node-version: "24"
          cache: "npm" # Tự động cache node_modules giúp các lần deploy sau nhanh hơn
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        env:
          # Dòng này sẽ lấy API Key từ Bước 1 bạn đã cài để đưa vào web
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5 # Đã nâng cấp lên v5 mới nhất (hỗ trợ Node 24 hoàn toàn)
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Giữ nguyên v4 (đã tương thích với v5 của upload-pages-artifact)
