name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Chạy khi có code mới đẩy lên nhánh main hoặc master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Sử dụng thẻ SHA commit cố định của phiên bản v4 mới nhất để bỏ qua cảnh báo Node 20
        uses: actions/checkout@eef6142ac12613e53c408f96be1024665429928d # Phiên bản v4.2.2 chính thức

      - name: Setup Node
        # Sử dụng thẻ SHA commit cố định của setup-node v4 mới nhất chạy Node 24 gốc
        uses: actions/setup-node@3922559a8102d6987056a2f78396ef5d65d64be2 # Phiên bản v4.2.0 chính thức
        with:
          node-version: "24"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
